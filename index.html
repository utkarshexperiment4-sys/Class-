<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Temporary Secret Chat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; padding: 20px; }
        #chat-container { width: 100%; max-width: 400px; }
        input { width: 80%; padding: 10px; margin-bottom: 10px; }
        #messages { height: 300px; border: 1px solid #333; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #1e1e1e; }
    </style>
</head>
<body>
    <div id="chat-container">
        <h2>Secret Chat (30 Mins)</h2>
        <div id="setup">
            <input type="text" id="room-input" placeholder="पासवर्ड (Room ID) डालें">
            <button onclick="joinRoom()">Join Room</button>
        </div>

        <div id="chat-box" style="display:none;">
            <div id="messages"></div>
            <input type="text" id="msg-input" placeholder="संदेश लिखें...">
            <button onclick="sendMsg()">Send</button>
        </div>
    </div>

    <script>
        // यहाँ अपना Render का URL डालें
        const socket = io("https://YOUR_RENDER_URL.onrender.com");
        let currentRoom = "";

        function joinRoom() {
            currentRoom = document.getElementById('room-input').value;
            if(currentRoom) {
                socket.emit('join-room', currentRoom);
                document.getElementById('setup').style.display = 'none';
                document.getElementById('chat-box').style.display = 'block';
            }
        }

        function sendMsg() {
            const msg = document.getElementById('msg-input').value;
            if(msg) {
                socket.emit('send-msg', { roomId: currentRoom, message: msg });
                document.getElementById('msg-input').value = '';
            }
        }

        socket.on('receive-msg', (msg) => {
            const div = document.createElement('div');
            div.innerText = msg;
            document.getElementById('messages').appendChild(div);
        });

        socket.on('error-msg', (err) => {
            alert(err);
            location.reload();
        });
    </script>
</body>
</html>
