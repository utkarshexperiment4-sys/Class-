<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTK Stealth Chat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 0; }
        #chat-container { display: flex; flex-direction: column; height: 100vh; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 20px; border-bottom: 1px solid #333; }
        .controls { padding: 10px; display: flex; gap: 10px; background: #111; }
        input { flex-grow: 1; padding: 10px; border: none; border-radius: 5px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; }
        
        /* Video Overlay */
        #video-overlay { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: #000; z-index: 1000; 
        }
        #meet { width: 100%; height: 90%; }
        .close-vid { width: 100%; height: 10%; background: #dc3545; border: none; color: white; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="messages"></div>
    <div class="controls">
        <input type="text" id="msg-input" placeholder="मैसेज लिखें...">
        <button onclick="sendMessage()">भेजें</button>
        <button onclick="triggerVideo()" style="background:#007bff;">वीडियो कॉल</button>
    </div>
</div>

<div id="video-overlay">
    <div id="meet"></div>
    <button class="close-vid" onclick="closeVideo()">कॉल काटें</button>
</div>

<script>
    const socket = io('https://आपका-रेंडर-लिंक.onrender.com'); // यहाँ अपना Render लिंक डालें
    const METERED_SECRET_KEY = "CLHPQWNtmuZOG-pwUF0rhLVNWCYVp5hlsWJgni0Dd0KucLFE";
    const METERED_DOMAIN = "60483901.metered.live";
    
    let currentRoom = "PublicRoom"; // इसे आप बदल सकते हैं
    let userName = "User-" + Math.floor(Math.random() * 1000);

    socket.emit('join-room', currentRoom);

    function sendMessage() {
        const msg = document.getElementById('msg-input').value;
        if(msg) {
            socket.emit('send-message', { roomId: currentRoom, user: userName, text: msg });
            document.getElementById('msg-input').value = '';
        }
    }

    socket.on('receive-message', (data) => {
        const div = document.createElement('div');
        div.innerHTML = `<b>${data.user}:</b> ${data.text}`;
        document.getElementById('messages').appendChild(div);
    });

    // जब कोई वीडियो कॉल शुरू करे
    socket.on('video-started', () => {
        startPrivateVideo();
    });

    function triggerVideo() {
        socket.emit('start-video-signal', currentRoom);
        startPrivateVideo();
    }

    async function startPrivateVideo() {
        document.getElementById('video-overlay').style.display = 'block';
        const meetDiv = document.getElementById('meet');
        meetDiv.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>कनेक्ट हो रहा है...</h2>";

        try {
            // Room बनाना/चेक करना
            await fetch(`https://${METERED_DOMAIN}/api/v1/room/${currentRoom}?secretKey=${METERED_SECRET_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            });

            // Iframe लोड करना
            meetDiv.innerHTML = `
                <iframe 
                    src="https://${METERED_DOMAIN}/${currentRoom}" 
                    allow="camera; microphone; display-capture; fullscreen" 
                    style="width: 100%; height: 100%; border: none;">
                </iframe>`;
        } catch (e) {
            alert("कॉल शुरू नहीं हो सकी।");
            closeVideo();
        }
    }

    function closeVideo() {
        document.getElementById('video-overlay').style.display = 'none';
        document.getElementById('meet').innerHTML = '';
    }
</script>

</body>
</html>
