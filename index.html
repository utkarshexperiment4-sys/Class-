<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTK Stealth Chat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 0; overflow: hidden; }
        #chat-container { display: flex; flex-direction: column; height: 100vh; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 20px; border-bottom: 1px solid #333; }
        .controls { padding: 10px; display: flex; gap: 10px; background: #111; }
        input { flex-grow: 1; padding: 10px; border: none; border-radius: 5px; background: #222; color: #fff; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
        
        #video-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; }
        #meet-frame { width: 100%; height: 90%; border: none; }
        .close-vid { width: 100%; height: 10%; background: #dc3545; border: none; color: white; font-size: 18px; cursor: pointer; }
        .perm-box { text-align: center; padding-top: 100px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="messages"></div>
    <div class="controls">
        <input type="text" id="msg-input" placeholder="मैसेज लिखें...">
        <button onclick="sendMessage()">भेजें</button>
        <button onclick="triggerVideo()" style="background:#007bff;">वीडियो कॉल</button>
    </div>
</div>

<div id="video-overlay">
    <div id="video-content" style="height: 100%;">
        <div id="permission-screen" class="perm-box">
            <button onclick="startCameraForce()" style="padding:20px; font-size:20px; background:#28a745; color:white; border:none; border-radius:10px;">कैमरा चालू करें</button>
            <p style="margin-top:15px; color:#aaa;">(परमिशन मांगने पर 'Allow' दबाएँ)</p>
        </div>
        <iframe id="meet-frame" allow="camera; microphone; fullscreen; display-capture;" style="display:none;"></iframe>
        <button class="close-vid" onclick="closeVideo()">कॉल काटें</button>
    </div>
</div>

<script>
    const socket = io('https://class-7ly0.onrender.com'); 
    const currentRoom = "publicroom"; 
    let userName = "User-" + Math.floor(Math.random() * 1000);

    socket.emit('join-room', currentRoom);

    function sendMessage() {
        const msg = document.getElementById('msg-input').value;
        if(msg) {
            socket.emit('send-message', { roomId: currentRoom, user: userName, text: msg });
            document.getElementById('msg-input').value = '';
        }
    }

    socket.on('receive-message', (data) => {
        const div = document.createElement('div');
        div.style.marginBottom = "10px";
        div.innerHTML = `<span style="color:#28a745;">${data.user}:</span> ${data.text}`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('video-started', () => {
        document.getElementById('video-overlay').style.display = 'block';
    });

    function triggerVideo() {
        socket.emit('start-video-signal', currentRoom);
        document.getElementById('video-overlay').style.display = 'block';
    }

    // यही वह फंक्शन है जो परमिशन को 'Force' करेगा
    async function startCameraForce() {
        try {
            // १. ब्राउज़र से सीधे कैमरा परमिशन मांगें
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            
            // २. अगर परमिशन मिल गई, तो स्ट्रीम बंद करें और Iframe लोड करें
            stream.getTracks().forEach(track => track.stop());
            
            const frame = document.getElementById('meet-frame');
            frame.src = `https://60483901.metered.live/${currentRoom}?skipPrejoin=true`;
            frame.style.display = "block";
            document.getElementById('permission-screen').style.display = "none";
            
        } catch (err) {
            alert("सच यह है कि कैमरा ब्लॉक है। ब्राउज़र के 'Lock' आइकन पर जाकर Allow करें।");
            console.error(err);
        }
    }

    function closeVideo() {
        document.getElementById('video-overlay').style.display = 'none';
        const frame = document.getElementById('meet-frame');
        frame.src = "";
        frame.style.display = "none";
        document.getElementById('permission-screen').style.display = "block";
    }
</script>

</body>
</html>
