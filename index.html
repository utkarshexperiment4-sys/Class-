<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTK Stealth Chat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg: #000; --text: #fff; --msg-bg: #1a1a1a; --primary: #28a745;
        }
        [data-theme="light"] {
            --bg: #f4f4f4; --text: #000; --msg-bg: #fff; --primary: #007bff;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; }
        
        /* Login Screen */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 15px; }
        .input-box { width: 80%; max-width: 300px; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #111; color: white; }
        [data-theme="light"] .input-box { background: #fff; color: #000; }

        /* Chat Layout */
        #chat-screen { display: none; flex-direction: column; height: 100vh; max-width: 800px; margin: auto; border-left: 1px solid #333; border-right: 1px solid #333; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 75%; background: var(--msg-bg); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .my-msg { align-self: flex-end; background: var(--primary); color: white; }

        /* Controls */
        .controls { padding: 15px; display: flex; gap: 10px; background: var(--msg-bg); border-top: 1px solid #333; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .theme-btn { position: fixed; top: 10px; right: 10px; z-index: 100; font-size: 20px; background: none; border: none; cursor: pointer; color: var(--text); }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            #chat-screen { border: none; }
            .msg { max-width: 85%; }
        }
    </style>
</head>
<body>

<button class="theme-btn" onclick="toggleTheme()">🌓</button>

<div id="login-screen">
    <h2>UTK Stealth Login</h2>
    <input type="text" id="username" class="input-box" placeholder="यूज़रनेम डालें">
    <input type="password" id="password" class="input-box" placeholder="पासवर्ड डालें">
    <button class="btn" style="background:#28a745; color:white;" onclick="login()">Chat शुरू करें</button>
</div>

<div id="chat-screen">
    <div id="messages"></div>
    <div class="controls">
        <input type="text" id="msg-input" class="input-box" style="flex-grow:1;" placeholder="मैसेज टाइप करें...">
        <button class="btn" style="background:var(--primary); color:white;" onclick="sendMessage()">भेजें</button>
    </div>
</div>

<script>
    const socket = io('https://class-7ly0.onrender.com'); //
    let currentUser = "";
    let room = "StealthRoom101";

    // लॉगिन फंक्शन
    function login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        
        // कड़वा सच: यहाँ आप अपना पासवर्ड फिक्स कर सकते हैं
        if(u && p === "1234") { 
            currentUser = u;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            socket.emit('join-room', room);
        } else {
            alert("गलत पासवर्ड या नाम!");
        }
    }

    // मैसेज भेजना
    function sendMessage() {
        const text = document.getElementById('msg-input').value;
        if(text) {
            socket.emit('send-message', { roomId: room, user: currentUser, text: text });
            document.getElementById('msg-input').value = '';
        }
    }

    // मैसेज प्राप्त करना
    socket.on('receive-message', (data) => {
        const div = document.createElement('div');
        const isMe = data.user === currentUser;
        div.className = `msg ${isMe ? 'my-msg' : ''}`;
        div.innerHTML = `<b>${data.user}</b><br>${data.text}`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    // डार्क-लाइट मोड
    function toggleTheme() {
        const current = document.body.getAttribute('data-theme');
        document.body.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
    }
</script>
</body>
</html>
