<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTK Stealth Chat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.metered.ca/sdk/frame/1.4.3/sdk-frame.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 0; overflow: hidden; }
        #chat-container { display: flex; flex-direction: column; height: 100vh; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 20px; border-bottom: 1px solid #333; }
        .controls { padding: 10px; display: flex; gap: 10px; background: #111; }
        input { flex-grow: 1; padding: 10px; border: none; border-radius: 5px; background: #222; color: #fff; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
        
        /* Video Overlay */
        #video-overlay { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: #000; z-index: 1000; 
        }
        #metered-frame-container { width: 100%; height: 90%; }
        .close-vid { width: 100%; height: 10%; background: #dc3545; border: none; color: white; font-size: 18px; cursor: pointer; }
        
        .join-box { text-align: center; padding-top: 100px; }
        .join-btn { padding: 20px 40px; background: #007bff; color: white; border: none; border-radius: 10px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="messages"></div>
    <div class="controls">
        <input type="text" id="msg-input" placeholder="मैसेज लिखें...">
        <button onclick="sendMessage()">भेजें</button>
        <button onclick="triggerVideo()" style="background:#007bff;">वीडियो कॉल</button>
    </div>
</div>

<div id="video-overlay">
    <div id="metered-frame-container"></div>
    <button class="close-vid" onclick="closeVideo()">कॉल काटें</button>
</div>

<script>
    // १. अपना रेंडर लिंक यहाँ पक्का करें
    const socket = io('https://class-7ly0.onrender.com'); 
    const currentRoom = "publicroom"; // डैशबोर्ड वाला रूम नाम
    let userName = "User-" + Math.floor(Math.random() * 1000);

    socket.emit('join-room', currentRoom);

    // मैसेज भेजने का लॉजिक
    function sendMessage() {
        const msg = document.getElementById('msg-input').value;
        if(msg) {
            socket.emit('send-message', { roomId: currentRoom, user: userName, text: msg });
            document.getElementById('msg-input').value = '';
        }
    }

    socket.on('receive-message', (data) => {
        const div = document.createElement('div');
        div.style.marginBottom = "10px";
        div.innerHTML = `<span style="color:#28a745;">${data.user}:</span> ${data.text}`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    // कॉल सिग्नल मिलने पर
    socket.on('video-started', () => {
        showJoinScreen();
    });

    function triggerVideo() {
        socket.emit('start-video-signal', currentRoom);
        showJoinScreen();
    }

    // २. स्क्रीन पर बटन दिखाना ताकि ब्राउज़र परमिशन ब्लॉक न करे
    function showJoinScreen() {
        document.getElementById('video-overlay').style.display = 'block';
        const container = document.getElementById('metered-frame-container');
        container.innerHTML = `
            <div class="join-box">
                <button class="join-btn" onclick="connectVideo()">कॉल में शामिल हों (Join Call)</button>
                <p style="color:#888; margin-top:15px;">कैमरा चालू करने के लिए बटन दबाएँ</p>
            </div>`;
    }

    // ३. असली वीडियो कनेक्शन
    function connectVideo() {
        const container = document.getElementById('metered-frame-container');
        container.innerHTML = ""; // बटन हटाएँ

        var frame = new MeteredFrame();
        frame.init({
            roomURL: "60483901.metered.live/publicroom",
            container: container,
            skipPrejoin: true // बटन दबाने के बाद सीधे अंदर
        }).catch(err => {
            alert("Camera Error: कृपया ब्राउज़र सेटिंग्स में कैमरा Allow करें।");
            closeVideo();
        });
    }

    function closeVideo() {
        document.getElementById('video-overlay').style.display = 'none';
        document.getElementById('metered-frame-container').innerHTML = '';
    }
</script>

</body>
</html>
